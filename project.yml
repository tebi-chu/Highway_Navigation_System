name: HighwayAssist
options:
  bundleIdPrefix: jp.tebcub
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  HighwayAssist:
    type: application
    platform: iOS
    sources:
      - path: HighwayAssist
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tebcub.HighwayAssist
        INFOPLIST_FILE: HighwayAssist/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - HighwayAssistTests
  HighwayAssistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HighwayAssistTests
    dependencies:
      - target: HighwayAssist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tebcub.HighwayAssistTests
        GENERATE_INFOPLIST_FILE: YES
