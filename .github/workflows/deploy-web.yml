name: WebアプリをCloudflareへ公開

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: highway-assist-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: pnpmを準備
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 必須設定を確認
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID が未設定です"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN が未設定です"; exit 1; }
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || { echo "CLOUDFLARE_D1_DATABASE_ID が未設定です"; exit 1; }

      - name: 依存パッケージをインストール
        run: pnpm install --frozen-lockfile

      - name: 品質確認
        run: pnpm lint

      - name: 公開用アプリを作成
        run: pnpm build

      - name: Cloudflare公開設定を作成
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Cloudflare Workersへ公開
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json

