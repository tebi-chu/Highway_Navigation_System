<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07140f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="高速道路ナビ">
  <title>高速道路アシスト</title>
  <link rel="icon" type="image/png" href="highway-icon.png">
  <link rel="apple-touch-icon" href="highway-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="login" class="login-shell">
    <section class="login-card">
      <div class="brand"><span>C4</span><div><b>高速道路アシスト</b><small>HIGHWAY ASSIST</small></div></div>
      <p class="eyebrow">簡易アクセス確認</p>
      <h1>4桁PINを入力</h1>
      <p class="intro">PINを知っている利用者だけナビ画面を表示します。</p>
      <form id="pin-form">
        <label for="pin">PINコード</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]{4}" required>
        <p id="pin-error" class="error" role="alert"></p>
        <button>ナビを開く</button>
      </form>
      <p class="notice">このPINは簡易的な表示制限です。機密情報の保護には使用できません。</p>
      <a class="editor-link" href="?editor=1">登録編集者用画面</a>
    </section>
  </main>

  <main id="navigation" class="navigation-screen" hidden>
    <header class="live-route">
      <div><span id="route-number">C4</span><strong id="highway-name">高速道路アシスト</strong></div>
      <b id="direction">GPS待機中</b>
    </header>
    <section class="live-status"><span id="gps-dot"></span><span id="status-message">現在位置を確認しています…</span><b>標準時間</b></section>
    <section id="point-list" class="live-list" aria-live="polite"></section>
    <footer class="vehicle-position"><i></i><b>現在地</b><span id="speed"></span></footer>
  </main>

  <main id="editor" class="editor-shell" hidden>
    <section class="editor-panel">
      <div class="brand"><span>E4</span><div><b>施設情報編集</b><small>FACILITY EDITOR</small></div></div>
      <p class="intro">自宅から高速道路・方向・SA／PAを選び、全端末共通の設備情報を編集します。</p>
      <div id="editor-setup" class="editor-message"></div>
      <div id="google-signin"></div>
      <div id="editor-account" class="editor-account" hidden></div>
      <button id="editor-logout" class="secondary-button" type="button" hidden>Googleからログアウト</button>
      <div id="editor-controls" hidden>
        <label for="editor-road">高速道路・走行方向</label>
        <select id="editor-road"></select>
        <label for="editor-point">SA・PA</label>
        <select id="editor-point"></select>
        <section id="editor-preview" class="editor-preview"></section>
        <button id="editor-edit" class="primary-button" type="button">この地点を編集</button>
      </div>
      <a class="editor-link" href="./">ナビ画面へ戻る</a>
    </section>
  </main>

  <dialog id="facility-dialog" class="facility-dialog">
    <form id="facility-form" method="dialog">
      <header><div><span id="edit-kinds"></span><strong id="edit-name"></strong></div><button id="edit-close" type="button" aria-label="閉じる">×</button></header>
      <p id="edit-mode" class="edit-mode"></p>
      <fieldset><legend>設備</legend><div id="facility-options" class="edit-options"></div></fieldset>
      <fieldset><legend>店舗名</legend><div id="brand-options" class="edit-options brand-options"></div></fieldset>
      <p id="edit-error" class="error" role="alert"></p>
      <button id="edit-save" class="primary-button" type="submit">全端末へ保存</button>
      <p class="notice">保存した内容は、この地点を表示するすべてのiPhone・Androidへ反映されます。</p>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
